spring:
  application:
    name: zapflow

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Configuração lida de variáveis de ambiente (ver .env.example). Nunca coloque valores reais aqui.
zapflow:
  whatsapp:
    api-version: ${WHATSAPP_API_VERSION:v24.0}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
  webhook:
    verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    app-secret: ${META_APP_SECRET:}
  envio:
    rate-per-second: ${SEND_RATE_PER_SECOND:20}
    max-retries: ${SEND_MAX_RETRIES:5}
