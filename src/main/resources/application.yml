spring:
  application:
    name: zapflow
  config:
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Configuração lida de variáveis de ambiente (ver .env.example). Nunca coloque valores reais aqui.
zapflow:
  provider:
    base-url: ${WHATSAPP_PROVIDER_URL:http://localhost:8081}
    instance-name: ${WHATSAPP_PROVIDER_INSTANCE:}
    api-key: ${WHATSAPP_PROVIDER_API_KEY:}
